name: Build Native Launcher APK and Windows Standalone EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: windows-latest

    steps:
      - name: 1. 檢出你的主專案程式碼 (main.py)
        uses: actions/checkout@v4

      - name: 2. 檢出 Gathin23/cleanyourtv 原專案源碼
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: c5d75e8e8071d6545e78ccbb6b4a303774f2e048
          path: cleanyourtv-src

      - name: 3. 配置 JDK 17 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. 編譯原生 Launcher APK 並自動提取真實包名
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "assets" | Out-Null

          # 1. 自動從原專案源碼提取 applicationId / package name
          $pkgName = "com.cleanyourtv.launcher"
          $gradleFiles = Get-ChildItem -Path "cleanyourtv-src/launcher" -Include "build.gradle", "build.gradle.kts", "AndroidManifest.xml" -Recurse
          foreach ($f in $gradleFiles) {
            $content = Get-Content $f.FullName -Raw
            if ($content -match 'applicationId\s*[= ]\s*["'']([^"'']+)["'']') {
              $pkgName = $matches[1]
              break
            } elseif ($content -match 'package\s*=\s*["'']([^"'']+)["'']') {
              $pkgName = $matches[1]
              break
            }
          }
          Write-Host "[+] 識別到原生 Launcher 包名: $pkgName"
          Set-Content -Path "assets/launcher_pkg.txt" -Value $pkgName -NoNewline

          # 2. 使用 Gradle 編譯已簽名的 Debug APK
          Push-Location "cleanyourtv-src/launcher"
          if (Test-Path "./gradlew.bat") {
            ./gradlew.bat assembleDebug --no-daemon
          } else {
            gradle assembleDebug --no-daemon
          }
          Pop-Location

          $apkFile = Get-ChildItem -Path "cleanyourtv-src/launcher" -Filter "*-debug.apk" -Recurse | Select-Object -First 1
          if ($apkFile) {
            Write-Host "[+] 成功編譯原生 Launcher APK: $($apkFile.FullName)"
            Copy-Item -Path $apkFile.FullName -Destination "assets/launcher.apk" -Force
          } else {
            throw "找不到編譯輸出的 APK 檔案！"
          }

      - name: 5. 配置 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 6. 下載 Google 官方 ADB 工具
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "platform-tools.zip" -UseBasicParsing
          Expand-Archive -Path "platform-tools.zip" -DestinationPath "." -Force

      - name: 7. 安裝 PyInstaller 與 CustomTkinter
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter packaging

      - name: 8. 封裝為內嵌原生 Launcher 的獨立 EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "CleanYourTV_macOS_GUI" `
            --collect-all customtkinter `
            --add-binary "platform-tools/adb.exe;platform-tools" `
            --add-binary "platform-tools/AdbWinApi.dll;platform-tools" `
            --add-binary "platform-tools/AdbWinUsbApi.dll;platform-tools" `
            --add-data "assets/launcher.apk;assets" `
            --add-data "assets/launcher_pkg.txt;assets" `
            main.py

      - name: 9. 上傳編譯完成的 APK 與 EXE 構建產物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-NativeLauncher-Bundle
          path: |
            dist/CleanYourTV_macOS_GUI.exe
            assets/launcher.apk
          if-no-files-found: error
