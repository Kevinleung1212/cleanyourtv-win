name: Build Windows Standalone EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允許在 GitHub 頁面手動觸發編譯

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 1. 檢出程式碼 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 自動下載 Google 官方 ADB (Platform-Tools) 與 Launcher APK
        shell: pwsh
        run: |
          # 下載並解壓縮 Windows 版 ADB 工具
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "platform-tools.zip"
          Expand-Archive -Path "platform-tools.zip" -DestinationPath "." -Force
          
          # 建立 assets 目錄並下載 Projectivy Launcher APK (若倉庫內已有 APK 可註解此段)
          New-Item -ItemType Directory -Force -Path "assets"
          if (-not (Test-Path "assets/launcher.apk")) {
            Write-Host "正在從 GitHub Releases 獲取最新 Projectivy Launcher APK..."
            $releaseUrl = "https://api.github.com/repos/spocky/miproja1/releases/latest"
            $release = Invoke-RestMethod -Uri $releaseUrl
            $apkAsset = $release.assets | Where-Object { $_.name -like "*.apk" } | Select-Object -First 1
            Invoke-WebRequest -Uri $apkAsset.browser_download_url -OutFile "assets/launcher.apk"
          }

      - name: 4. 安裝打包工具 PyInstaller 與依賴
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: 5. 使用 PyInstaller 封裝成單一獨立 EXE
        shell: pwsh
        run: |
          # 將 adb.exe、必要 DLL 以及 launcher.apk 封裝進單一執行檔內
          pyinstaller --noconfirm --onefile --console `
            --name "CleanYourTV_Win10_11" `
            --add-binary "platform-tools/adb.exe;platform-tools" `
            --add-binary "platform-tools/AdbWinApi.dll;platform-tools" `
            --add-binary "platform-tools/AdbWinUsbApi.dll;platform-tools" `
            --add-data "assets/launcher.apk;assets" `
            main.py

      - name: 6. 上傳編譯完成的 EXE 構建產物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Windows-Standalone
          path: dist/CleanYourTV_Win10_11.exe
          if-no-files-found: error
